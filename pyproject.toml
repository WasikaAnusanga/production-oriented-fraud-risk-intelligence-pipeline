[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-intelligence-v2"
version = "0.1.0"
description = "Production-oriented Fraud Risk Intelligence Pipeline"
authors = [
    { name = "MLOps & Data Science Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
    "pytest>=8.0.0",
    "reportlab>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
